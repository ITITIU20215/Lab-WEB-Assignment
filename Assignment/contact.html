    <main>
    <h2>Get in Touch</h2>
    <form action="#" method="post">
        <fieldset>
            <legend>Personal Information</legend>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required placeholder="Nguyen Van A">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="nguyenvana@example.com">
        </fieldset>

        <fieldset>
            <legend>Inquiry Details</legend>
            <label for="subject">Topic:</label>
            <input list="topics" id="subject" name="subject">
            <datalist id="topics">
                <option value="Data Science">
                <option value="Webapp Development">
                <option value="Game Development">
            </datalist>

            <label>Urgency:</label>
            <input type="range" min="1" max="5" name="urgency">

            <label for="msg">Message:</label>
            <textarea id="msg" name="msg" rows="4" placeholder="Enter your message here..."></textarea>
        </fieldset>

        <button type="submit">Send Message</button>
        <button type="reset">Clear Form</button>
    </form>
</main>
